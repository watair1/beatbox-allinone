<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0c10">
<meta name="description" content="음원 파일 없이 Web Audio API로 소리를 합성하는 비트박스 사운드보드">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="비트박스">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="">
<link rel="apple-touch-icon" href="">
<link rel="icon" href="">
<title>비트박스 올인원 v0.1.5</title>
<style>
  :root{
    --bg:#0b0c10;
    --panel:#14161d;
    --line:#252936;
    --txt:#e8eaf2;
    --dim:#767d93;
    /* 왼쪽 열 = 드럼 몸통 (따뜻한 색) */
    --kick:#ff5f52;
    --snare:#ffb03a;
    --tom:#c77dff;
    --rim:#ff7eb6;
    /* 오른쪽 열 = 심벌·박수 (차가운 색) */
    --hat:#2fd0bb;
    --open:#7b9bff;
    --clap:#8fe388;
    --crash:#ffd166;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  html{background:var(--bg);}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    display:flex;flex-direction:column;
    gap:8px;
    padding:calc(10px + var(--safe-t)) 10px calc(8px + var(--safe-b));
    overscroll-behavior:none;
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
  }

  /* ── 헤더 ─────────────────────────────── */
  header{flex:0 0 auto;display:flex;align-items:center;gap:7px;}
  h1{font-size:14px;margin:0;letter-spacing:-.3px;font-weight:700;}
  .ver{font-size:11px;color:var(--dim);font-weight:500;}
  .btn{
    font:inherit;font-size:11px;font-weight:600;color:var(--dim);
    background:transparent;border:1px solid var(--line);border-radius:8px;
    padding:5px 10px;cursor:pointer;
  }
  .btn:active{transform:scale(.95);}
  header .btn{margin-left:auto;}
  header .btn.on{color:var(--txt);border-color:var(--txt);}

  /* ── 시작 게이트 ───────────────────────
     브라우저는 사용자 제스처 전에 오디오를 막는다.
     이 버튼이 그 "첫 제스처" 역할을 한다. */
  #gate{
    position:fixed;inset:0;z-index:50;
    background:radial-gradient(120% 90% at 50% 0%,#171a24 0%,var(--bg) 60%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:26px;text-align:center;
    transition:opacity .28s ease;
  }
  #gate.off{opacity:0;pointer-events:none;}
  #gate[hidden]{display:none;}   /* id 선택자가 세서 [hidden] 기본 규칙을 덮어쓴다 */
  #gate .logo{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:64px;height:64px;}
  #gate .logo i{border-radius:11px;}
  #gate h2{margin:0;font-size:21px;letter-spacing:-.4px;}
  #gate p{margin:0;color:var(--dim);font-size:13px;line-height:1.65;max-width:310px;}
  #gate .two{color:var(--txt);font-weight:600;}
  #start{
    margin-top:4px;padding:17px 46px;font:inherit;font-size:16px;font-weight:700;
    background:var(--txt);color:var(--bg);border:0;border-radius:16px;cursor:pointer;
    transition:transform .08s ease;
  }
  #start:active{transform:scale(.96);}
  #start:disabled{opacity:.5;}
  .fineprint{font-size:11px !important;line-height:1.6;opacity:.8;}
  #gate .err{color:var(--kick);font-size:12px;min-height:1em;}

  /* ── 패드 그리드 ───────────────────────
     세로: 왼쪽 열 = 드럼 몸통(킥·스네어·톰·림샷), 오른쪽 열 = 심벌·박수.
       · 자주 겹치는 조합(킥+햇, 스네어+햇, 킥+크래시, 스네어+클랩)이
         항상 좌우 다른 엄지에 걸린다
       · 서로 choke 관계라 동시에 울릴 수 없는 햇/오픈햇은 같은 엄지에 묶는다
     가로: 왼쪽 절반 = 드럼, 오른쪽 절반 = 심벌. 손 나누기는 그대로. */
  .pads{
    position:relative;
    flex:1 1 auto;min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:repeat(4,1fr);
    grid-template-areas:
      "kick  hat"
      "snare open"
      "tom   clap"
      "rim   crash";
    gap:8px;
  }
  .pad[data-k="kick"] {grid-area:kick;  --c:var(--kick);}
  .pad[data-k="snare"]{grid-area:snare; --c:var(--snare);}
  .pad[data-k="tom"]  {grid-area:tom;   --c:var(--tom);}
  .pad[data-k="rim"]  {grid-area:rim;   --c:var(--rim);}
  .pad[data-k="hat"]  {grid-area:hat;   --c:var(--hat);}
  .pad[data-k="open"] {grid-area:open;  --c:var(--open);}
  .pad[data-k="clap"] {grid-area:clap;  --c:var(--clap);}
  .pad[data-k="crash"]{grid-area:crash; --c:var(--crash);}

  .pad{
    position:relative;overflow:hidden;
    font:inherit;color:inherit;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    cursor:pointer;
    touch-action:none;           /* 스크롤/줌에 터치를 뺏기지 않게 */
    transition:transform .05s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease;
  }
  /* 쉬는 중에도 색 정체성이 읽히게 아주 옅은 워시를 깔아 둔다 */
  .pad::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(95% 75% at 50% 0%,var(--c),transparent 72%);
    opacity:.07;transition:opacity .16s ease;
  }
  .pad > *{position:relative;}
  .pad .name{font-size:15px;font-weight:700;letter-spacing:-.3px;}
  .pad .key{
    font-size:10px;color:var(--dim);
    border:1px solid var(--line);border-radius:6px;
    padding:2px 7px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    transition:color .16s ease,border-color .16s ease;
  }
  .pad .dot{
    position:absolute;top:10px;right:10px;
    width:7px;height:7px;border-radius:50%;
    background:var(--c);opacity:.45;
    transition:opacity .16s ease,box-shadow .16s ease;
  }
  .pad .n{
    position:absolute;bottom:8px;left:11px;
    font-size:9.5px;color:var(--dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    opacity:0;transition:opacity .2s ease;
  }
  .pad.used .n{opacity:.7;}

  /* --v = 이번 타격 세기(0~1). 세게 칠수록 밝고 크게 번진다 */
  .pad.hit{
    transform:scale(calc(1 - .05 * var(--v,1)));
    background:color-mix(in srgb, var(--c) calc(14% * var(--v,1)), var(--panel));
    border-color:var(--c);
    box-shadow:0 0 0 1px var(--c) inset, 0 0 calc(34px * var(--v,1)) -6px var(--c);
  }
  .pad.hit::before{opacity:calc(.08 + .22 * var(--v,1));}
  .pad.hit .dot{opacity:1;box-shadow:0 0 10px 1px var(--c);}
  .pad.hit .key{color:var(--c);border-color:var(--c);}

  /* 손가락이 올라가 있는 동안 — 어느 패드를 잡고 있는지 계속 보인다 */
  .pad.held{border-color:var(--c);}
  .pad.held::before{opacity:.16;}

  /* 오픈햇이 아직 울리는 중이라는 표시 (choke 대상) */
  .pad[data-k="open"].ringing .dot{opacity:1;animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.35;}}

  /* 터치 지점에서 퍼지는 링 — 손가락마다 따로, 세기만큼 크게 */
  .ripple{
    position:absolute;border-radius:50%;pointer-events:none;
    width:12px;height:12px;margin:-6px 0 0 -6px;
    background:var(--c);
    animation:ripple .42s ease-out forwards;
  }
  @keyframes ripple{to{transform:scale(var(--rs,20));opacity:0;}}

  /* ── 동시 타격 배지 ─────────────────── */
  #combo{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%) scale(.9);
    padding:8px 15px;border-radius:999px;
    background:rgba(11,12,16,.9);border:1px solid var(--line);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    font-size:12.5px;font-weight:700;white-space:nowrap;
    display:flex;align-items:center;gap:6px;
    pointer-events:none;opacity:0;z-index:5;
  }
  #combo.show{animation:combo 1s ease-out forwards;}
  @keyframes combo{
    0%  {opacity:0;transform:translate(-50%,-50%) scale(.82);}
    14% {opacity:1;transform:translate(-50%,-50%) scale(1.06);}
    24% {transform:translate(-50%,-50%) scale(1);}
    72% {opacity:1;}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1);}
  }
  #combo i{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  #combo .plus{color:var(--dim);font-weight:400;margin:0 -1px;}

  /* ── 푸터 ─────────────────────────────── */
  footer{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:10.5px;color:var(--dim);
  }
  .stats{display:flex;gap:9px;align-items:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #count{color:var(--txt);opacity:.85;}
  #chords{color:var(--hat);opacity:0;transition:opacity .3s ease;}
  #chords.on{opacity:.9;}
  #status{padding:3px 8px;border:1px solid var(--line);border-radius:999px;}
  #status.bad{color:var(--snare);border-color:var(--snare);}

  /* ── 사운드 튜닝 패널 ─────────────────
     이 앱은 음원이 아니라 코드로 소리를 만든다.
     그 파라미터를 그대로 열어주는 게 가장 자연스러운 확장이다. */
  #tune{
    position:fixed;inset:0;z-index:40;
    background:var(--bg);
    display:flex;flex-direction:column;gap:12px;
    padding:calc(14px + var(--safe-t)) 14px calc(14px + var(--safe-b));
    overflow-y:auto;overscroll-behavior:contain;
  }
  #tune[hidden]{display:none;}
  .thead{display:flex;align-items:center;gap:8px;}
  .thead b{font-size:15px;}
  .thead .sub{font-size:11px;color:var(--dim);}
  .thead .btn{margin-left:auto;}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .chip{
    font:inherit;font-size:11.5px;font-weight:600;
    padding:9px 4px;border-radius:10px;cursor:pointer;
    background:var(--panel);color:var(--dim);
    border:1px solid var(--line);
  }
  .chip.sel{color:var(--txt);border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--panel));}
  .slider{display:flex;flex-direction:column;gap:5px;}
  .slider .lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);}
  .slider .lab b{color:var(--txt);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line);}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line);}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;
    background:var(--cc,var(--txt));margin-top:-9px;border:0;cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:22px;height:22px;border-radius:50%;background:var(--cc,var(--txt));border:0;cursor:pointer;
  }
  .trow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .trow .sp{margin-left:auto;}
  #tune-play{
    font:inherit;font-size:15px;font-weight:700;padding:16px;border-radius:14px;
    border:1px solid var(--cc);background:color-mix(in srgb,var(--cc) 16%,var(--panel));
    color:var(--txt);cursor:pointer;
  }
  #tune-play:active{transform:scale(.98);}
  .note{font-size:11px;color:var(--dim);line-height:1.6;}

  /* 가로 모드 — 왼쪽 절반 드럼, 오른쪽 절반 심벌 */
  @media (orientation:landscape) and (max-height:560px){
    body{gap:6px;padding-top:calc(6px + var(--safe-t));}
    .pads{
      grid-template-columns:repeat(4,1fr);
      grid-template-rows:1fr 1fr;
      grid-template-areas:
        "kick snare hat  open"
        "tom  rim   clap crash";
    }
    #combo{top:auto;bottom:8px;transform:translate(-50%,0) scale(1);}
    #combo.show{animation:comboLand 1s ease-out forwards;}
    @keyframes comboLand{
      0%{opacity:0;transform:translate(-50%,0) scale(.82);}
      14%{opacity:1;transform:translate(-50%,0) scale(1.06);}
      24%{transform:translate(-50%,0) scale(1);}
      72%{opacity:1;}
      100%{opacity:0;transform:translate(-50%,0) scale(1);}
    }
    .chips{grid-template-columns:repeat(8,1fr);}
  }

  @media (min-width:620px) and (orientation:portrait){
    body{max-width:660px;margin:0 auto;padding-top:22px;}
    .pads{gap:12px;}
    .pad .name{font-size:18px;}
    #tune{max-width:660px;margin:0 auto;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
    #combo.show{opacity:1;}
  }
</style>
</head>
<body>

<!-- 오디오 게이트: 첫 사용자 제스처를 받아 AudioContext를 연다 -->
<div id="gate">
  <div class="logo">
    <i style="background:var(--kick)"></i><i style="background:var(--hat)"></i>
    <i style="background:var(--snare)"></i><i style="background:var(--open)"></i>
  </div>
  <h2>비트박스 올인원</h2>
  <p><b>v0.1.5 — 사운드보드</b><br><span class="two">패드 8개, 두 손가락 동시</span>, 세게/약하게.<br>음원 파일 없이 코드로 소리를 만듭니다.</p>
  <button id="start" type="button">시작하기</button>
  <p class="fineprint">브라우저는 한 번 눌러주기 전까지 소리를 막아둡니다.<br>그래서 이 버튼이 필요해요.</p>
  <p class="err" id="gate-err"></p>
</div>

<header>
  <h1>비트박스 올인원</h1>
  <span class="ver">v0.1.5</span>
  <button class="btn" id="tune-open" type="button">사운드 튜닝</button>
</header>

<main class="pads" id="pads">
  <button class="pad" type="button" data-k="kick"  tabindex="-1" aria-label="킥">
    <span class="dot"></span><span class="name">킥</span><span class="key">A · SPACE</span><span class="n">0</span></button>
  <button class="pad" type="button" data-k="snare" tabindex="-1" aria-label="스네어">
    <span class="dot"></span><span class="name">스네어</span><span class="key">S</span><span class="n">0</span></button>
  <button class="pad" type="button" data-k="hat"   tabindex="-1" aria-label="하이햇">
    <span class="dot"></span><span class="name">하이햇</span><span class="key">J</span><span class="n">0</span></button>
  <button class="pad" type="button" data-k="open"  tabindex="-1" aria-label="오픈 하이햇">
    <span class="dot"></span><span class="name">오픈 하이햇</span><span class="key">K</span><span class="n">0</span></button>
  <button class="pad" type="button" data-k="tom"   tabindex="-1" aria-label="톰">
    <span class="dot"></span><span class="name">톰</span><span class="key">D</span><span class="n">0</span></button>
  <button class="pad" type="button" data-k="rim"   tabindex="-1" aria-label="림샷">
    <span class="dot"></span><span class="name">림샷</span><span class="key">F</span><span class="n">0</span></button>
  <button class="pad" type="button" data-k="clap"  tabindex="-1" aria-label="클랩">
    <span class="dot"></span><span class="name">클랩</span><span class="key">L</span><span class="n">0</span></button>
  <button class="pad" type="button" data-k="crash" tabindex="-1" aria-label="크래시">
    <span class="dot"></span><span class="name">크래시</span><span class="key">;</span><span class="n">0</span></button>
  <div id="combo"></div>
</main>

<footer>
  <span>가운데=세게 · 가장자리=약하게</span>
  <span class="stats">
    <span id="status" hidden></span>
    <span id="chords"></span>
    <span id="count">0 hits</span>
  </span>
</footer>

<!-- 사운드 튜닝 -->
<div id="tune" hidden>
  <div class="thead">
    <b>사운드 튜닝</b>
    <span class="sub">코드로 만든 소리라 값을 직접 바꿀 수 있습니다</span>
    <button class="btn" id="tune-close" type="button">닫기</button>
  </div>
  <div class="chips" id="tune-chips"></div>
  <div id="tune-sliders"></div>
  <div class="trow" id="tune-presets"></div>
  <button id="tune-play" type="button">쳐보기</button>
  <div class="trow">
    <button class="btn" id="tune-reset" type="button">이 패드 초기화</button>
    <button class="btn sp" id="tune-reset-all" type="button">전부 초기화</button>
  </div>
  <p class="note">바꾼 값은 이 브라우저에 저장됩니다. 프리셋은 8개 패드 전부를 한 번에 바꿉니다.</p>
</div>

<script>
(() => {
'use strict';

/* ═══════════════════════════════════════════
   소리 파라미터 — 튜닝 패널이 이 값을 직접 만진다
   ═══════════════════════════════════════════ */
const DEFAULTS = {
  kick:  { pitch:150,  decay:0.42 },
  snare: { pitch:180,  noise:0.75, decay:0.19 },
  hat:   { cut:7000,   decay:0.06 },
  open:  { cut:7000,   decay:0.45 },
  tom:   { pitch:220,  decay:0.42 },
  rim:   { pitch:1700, decay:0.035 },
  clap:  { spread:0.011, decay:0.32 },
  crash: { cut:4000,   decay:1.6 }
};
// [키, 이름, 최소, 최대, 간격, 단위]
const SPEC = {
  kick:  [['pitch','시작 피치',80,300,1,'Hz'],   ['decay','길이',0.15,0.9,0.01,'s']],
  snare: [['pitch','톤 피치',120,280,1,'Hz'],    ['noise','노이즈',0.2,1,0.01,''], ['decay','길이',0.08,0.4,0.01,'s']],
  hat:   [['cut','필터',3000,12000,100,'Hz'],    ['decay','길이',0.02,0.15,0.005,'s']],
  open:  [['cut','필터',3000,12000,100,'Hz'],    ['decay','길이',0.15,1,0.01,'s']],
  tom:   [['pitch','피치',120,400,1,'Hz'],       ['decay','길이',0.2,0.9,0.01,'s']],
  rim:   [['pitch','피치',900,2600,10,'Hz'],     ['decay','길이',0.02,0.12,0.005,'s']],
  clap:  [['spread','퍼짐',0.006,0.024,0.001,'s'],['decay','길이',0.15,0.6,0.01,'s']],
  crash: [['cut','필터',2000,8000,100,'Hz'],     ['decay','길이',0.6,3,0.05,'s']]
};
const PRESETS = {
  '기본':   null,
  '808':    { kick:{pitch:120,decay:0.8}, snare:{pitch:200,noise:0.6,decay:0.16}, hat:{cut:9000,decay:0.045},
              open:{cut:9000,decay:0.6}, tom:{pitch:180,decay:0.6}, rim:{pitch:1900,decay:0.03},
              clap:{spread:0.009,decay:0.4}, crash:{cut:5000,decay:2.2} },
  '로파이': { kick:{pitch:170,decay:0.3}, snare:{pitch:150,noise:0.9,decay:0.12}, hat:{cut:4500,decay:0.05},
              open:{cut:4500,decay:0.3}, tom:{pitch:260,decay:0.3}, rim:{pitch:1200,decay:0.05},
              clap:{spread:0.015,decay:0.22}, crash:{cut:2500,decay:1} },
  '단단하게':{ kick:{pitch:200,decay:0.24}, snare:{pitch:220,noise:0.7,decay:0.1}, hat:{cut:11000,decay:0.03},
              open:{cut:11000,decay:0.22}, tom:{pitch:300,decay:0.25}, rim:{pitch:2300,decay:0.025},
              clap:{spread:0.007,decay:0.18}, crash:{cut:7000,decay:0.8} }
};
const KITS = Object.keys(DEFAULTS);
const LABEL = { kick:'킥', snare:'스네어', hat:'하이햇', open:'오픈햇',
                tom:'톰', rim:'림샷', clap:'클랩', crash:'크래시' };

const P = {};                                  // 지금 쓰는 값
const STORE = 'beatbox.tuning.v1';
function loadTuning(){
  KITS.forEach(k => { P[k] = Object.assign({}, DEFAULTS[k]); });
  try{
    const saved = JSON.parse(localStorage.getItem(STORE) || '{}');
    KITS.forEach(k => saved[k] && Object.assign(P[k], saved[k]));
  }catch(_){}                                   // file:// 등에서 막히면 그냥 기본값
}
function saveTuning(){
  try{ localStorage.setItem(STORE, JSON.stringify(P)); }catch(_){}
}
loadTuning();

/* ═══════════════════════════════════════════
   오디오 엔진
   ═══════════════════════════════════════════ */
let ctx = null, master = null, noiseBuf = null;

const el = {};
['gate','start','gate-err','count','chords','combo','status','pads',
 'tune','tune-open','tune-close','tune-chips','tune-sliders','tune-presets',
 'tune-play','tune-reset','tune-reset-all'].forEach(id => { el[id] = document.getElementById(id); });

function initAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) throw new Error('이 브라우저는 Web Audio를 지원하지 않습니다.');
  ctx = new AC();

  // 여러 패드를 동시에 쳐도 찌그러지지 않게 리미터를 물린다
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -6;
  limiter.knee.value      = 6;
  limiter.ratio.value     = 12;
  limiter.attack.value    = 0.002;
  limiter.release.value   = 0.12;

  master = ctx.createGain();
  master.gain.value = 0.9;
  master.connect(limiter).connect(ctx.destination);

  // 노이즈는 한 번만 만들어 두고 재생할 때마다 재사용
  const len = Math.floor(ctx.sampleRate * 0.5);
  noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}

function noiseSource(){
  const s = ctx.createBufferSource();
  s.buffer = noiseBuf;
  s.loop = true;                       // 감쇠가 버퍼(0.5초)보다 길어도 끊기지 않게
  return s;
}
function gainTo(node, t, peak, dur, attack){
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + (attack || 0.002));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  node.connect(g);
  return g;
}

/* ── 킥: 사인파를 시작 피치에서 3분의 1로 떨어뜨린다 ── */
function kick(t, v){
  const p = P.kick, o = ctx.createOscillator();
  o.type = 'sine';
  // 세게 칠수록 시작 피치가 조금 높다 = 어택이 밝아진다
  o.frequency.setValueAtTime(p.pitch * (0.88 + 0.24 * v), t);
  o.frequency.exponentialRampToValueAtTime(p.pitch / 3, t + p.decay * 0.26);
  gainTo(o, t, v, p.decay, 0.004).connect(master);
  o.start(t); o.stop(t + p.decay + 0.03);
}

/* ── 스네어: 하이패스 노이즈 + 삼각파 톤 ── */
function snare(t, v){
  const p = P.snare;
  const n = noiseSource(), hp = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 7000;
  n.connect(hp);
  gainTo(hp, t, p.noise * v, p.decay, 0.001).connect(master);
  n.start(t); n.stop(t + p.decay + 0.03);

  const o = ctx.createOscillator();
  o.type = 'triangle'; o.frequency.setValueAtTime(p.pitch, t);
  gainTo(o, t, 0.6 * v, p.decay * 0.7, 0.002).connect(master);
  o.start(t); o.stop(t + p.decay * 0.7 + 0.02);
}

/* ── 하이햇: 하이패스 노이즈. 닫힘=짧게 / 열림=길게 ──
   진짜 드럼에서 닫힌 하이햇은 울리던 오픈 하이햇을 끊는다(choke). */
let openHat = null;
const openPad = document.querySelector('.pad[data-k="open"]');

function chokeOpenHat(t){
  if(!openHat) return;
  const g = openHat.gain.gain;
  g.cancelScheduledValues(t);
  g.setValueAtTime(Math.max(g.value, 0.0001), t);
  g.exponentialRampToValueAtTime(0.0001, t + 0.028);   // 뚝 끊지 않고 아주 짧게 닫는다
  try { openHat.source.stop(t + 0.05); } catch(_){}
  openHat = null;
  openPad.classList.remove('ringing');
}

function hat(t, v, open){
  chokeOpenHat(t);                     // 닫힘/열림 어느 쪽이든 이전 오픈햇은 정리
  const p = open ? P.open : P.hat;
  const n = noiseSource(), hp = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = p.cut;
  n.connect(hp);
  const g = gainTo(hp, t, (open ? 0.5 : 0.42) * v, p.decay, 0.001);
  g.connect(master);
  n.start(t); n.stop(t + p.decay + 0.06);

  if(open){
    openHat = { gain:g, source:n };
    openPad.classList.add('ringing');
    n.onended = () => {                // 스스로 다 울리고 끝난 경우
      if(openHat && openHat.source === n){
        openHat = null;
        openPad.classList.remove('ringing');
      }
    };
  }
}

/* ── 톰: 킥과 같은 원리인데 더 높고 덜 떨어진다 + 어택 노이즈 ── */
function tom(t, v){
  const p = P.tom, o = ctx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(p.pitch * (0.92 + 0.16 * v), t);
  o.frequency.exponentialRampToValueAtTime(p.pitch * 0.55, t + p.decay * 0.8);
  gainTo(o, t, 0.85 * v, p.decay, 0.004).connect(master);
  o.start(t); o.stop(t + p.decay + 0.03);

  const n = noiseSource(), hp = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 2000;
  n.connect(hp);
  gainTo(hp, t, 0.14 * v, 0.03, 0.001).connect(master);
  n.start(t); n.stop(t + 0.06);
}

/* ── 림샷: 아주 짧고 단단한 '딱'. 좁은 밴드패스로 나무 느낌을 낸다 ── */
function rim(t, v){
  const p = P.rim;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = p.pitch; bp.Q.value = 2.6;
  bp.connect(master);

  const mix = ctx.createGain();
  mix.gain.setValueAtTime(0.0001, t);
  mix.gain.exponentialRampToValueAtTime(0.75 * v, t + 0.001);
  mix.gain.exponentialRampToValueAtTime(0.0001, t + p.decay);
  mix.connect(bp);

  const o1 = ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.setValueAtTime(p.pitch, t);
  const o2 = ctx.createOscillator(); o2.type = 'square';   o2.frequency.setValueAtTime(p.pitch * 0.42, t);
  const o2g = ctx.createGain(); o2g.gain.value = 0.35;
  o1.connect(mix); o2.connect(o2g).connect(mix);
  o1.start(t); o2.start(t);
  o1.stop(t + p.decay + 0.02); o2.stop(t + p.decay + 0.02);

  const n = noiseSource();
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(0.35 * v, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + p.decay * 0.6);
  n.connect(ng).connect(bp);
  n.start(t); n.stop(t + p.decay + 0.02);
}

/* ── 클랩: 노이즈를 아주 짧은 간격으로 세 번 튕기고 꼬리를 길게 ──
   손뼉 소리의 정체는 이 '세 번 튀는' 구조다. */
function clap(t, v){
  const p = P.clap;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.85;
  bp.connect(master);

  const n = noiseSource();
  const g = ctx.createGain();
  n.connect(g).connect(bp);

  g.gain.setValueAtTime(0.0001, t);
  for(let i = 0; i < 3; i++){
    const tt = t + i * p.spread;
    g.gain.setValueAtTime(0.9 * v, tt);
    g.gain.exponentialRampToValueAtTime(0.12 * v, tt + p.spread * 0.9);
  }
  const tail = t + 3 * p.spread;
  g.gain.setValueAtTime(0.9 * v, tail);
  g.gain.exponentialRampToValueAtTime(0.0001, tail + p.decay);
  n.start(t); n.stop(tail + p.decay + 0.05);
}

/* ── 크래시: 길게 남는 고역 노이즈 + 8kHz 부근을 들어올려 금속 느낌 ── */
function crash(t, v){
  const p = P.crash;
  const n = noiseSource();
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = p.cut;
  const pk = ctx.createBiquadFilter(); pk.type = 'peaking';  pk.frequency.value = 8000; pk.gain.value = 7; pk.Q.value = 0.7;
  n.connect(hp).connect(pk);
  gainTo(pk, t, 0.5 * v, p.decay, 0.006).connect(master);
  n.start(t); n.stop(t + p.decay + 0.05);
}

const VOICES = {
  kick, snare, tom, rim, clap, crash,
  hat:  (t, v) => hat(t, v, false),
  open: (t, v) => hat(t, v, true)
};

/* ═══════════════════════════════════════════
   재생 + 화면 피드백
   ═══════════════════════════════════════════ */
let hits = 0, chordCount = 0;
const perPad = {}; KITS.forEach(k => perPad[k] = 0);
const padEl = {};
document.querySelectorAll('.pad').forEach(p => { padEl[p.dataset.k] = p; });

/* 폰에서 화면을 껐다 켜거나 탭을 옮기면 컨텍스트가 suspended/interrupted가 된다.
   재생 직전에 매번 확인해서 되살린다. */
function ensureRunning(){
  if(ctx && ctx.state !== 'running') ctx.resume().then(showStatus, showStatus);
}
function showStatus(){
  if(!ctx) return;
  const bad = ctx.state !== 'running';
  el.status.hidden = !bad;
  el.status.textContent = bad ? '오디오 정지 — 화면 터치' : '';
  el.status.classList.toggle('bad', bad);
}

/* 두 손가락이 "동시에" 닿아도 이벤트는 보통 5~20ms 어긋나 도착한다.
   그걸 한 시각에 맞추려면 그만큼 미리보기 지연을 깔아야 하는데,
   드럼 패드에서 지연은 어긋남보다 훨씬 나쁘다. 게다가 음색이 다른 타악기 두 개는
   20~30ms 안쪽이면 사람 귀에 한 방으로 붙어 들린다. 그래서 맞추지 않고 바로 낸다. */
function play(k, x, y, src, v){
  if(!ctx || !VOICES[k]) return;
  ensureRunning();
  v = Math.max(0.15, Math.min(1, v == null ? 0.9 : v));

  // 이미 지난 시각에 예약하면 클릭 노이즈가 난다 → 항상 살짝 앞으로
  try { VOICES[k](ctx.currentTime + 0.002, v); } catch(e){ console.error(e); }

  hits++; perPad[k]++;
  el.count.textContent = hits + ' hits';

  const p = padEl[k];
  p.querySelector('.n').textContent = perPad[k];
  p.classList.add('used');
  p.style.setProperty('--v', v.toFixed(2));

  // 연타할 때 애니메이션이 다시 처음부터 돌게 리플로우를 강제
  p.classList.remove('hit');
  void p.offsetWidth;
  p.classList.add('hit');
  clearTimeout(p._t);
  p._t = setTimeout(() => p.classList.remove('hit'), 95);

  if(x != null) ripple(p, x, y, v);
  try { navigator.vibrate && navigator.vibrate(Math.round(4 + 8 * v)); } catch(_){}
  noteForChord(k, src);
}

function ripple(p, clientX, clientY, v){
  const r = p.getBoundingClientRect();
  const s = document.createElement('span');
  s.className = 'ripple';
  s.style.left = (clientX - r.left) + 'px';
  s.style.top  = (clientY - r.top)  + 'px';
  s.style.setProperty('--rs', (10 + 18 * v).toFixed(1));   // 세게 칠수록 크게 번진다
  s.style.opacity = (0.14 + 0.26 * v).toFixed(2);
  p.appendChild(s);
  setTimeout(() => s.remove(), 450);
}

/* ── 세기 ──
   진짜 드럼처럼 가운데를 치면 세고 가장자리로 갈수록 약하다.
   접촉 면적이나 pressure는 기기마다 0을 주거나 아예 안 줘서 못 믿는다.
   타격 위치는 어디서나 정확하고, 무엇보다 사용자가 배울 수 있다. */
function velocityAt(p, x, y){
  const r = p.getBoundingClientRect();
  const dx = (x - (r.left + r.width  / 2)) / (r.width  / 2);
  const dy = (y - (r.top  + r.height / 2)) / (r.height / 2);
  const d = Math.min(1, Math.hypot(dx, dy) / 1.1);
  return 1 - 0.6 * d * d;              // 가운데 1.0 → 모서리 0.4
}

/* ── 동시 타격 인식 ──
   "동시"의 기준을 시간만으로 잡으면 빠른 롤까지 조합으로 오인한다.
   진짜 기준은 손가락이 다른가다 — 같은 손가락(pointerId)이 패드를 쓸고 지나간 건
   아무리 빨라도 조합이 아니다. 그래서 서로 다른 입력원이 COMBO_MS 안에 들어온
   경우만 조합으로 본다. 덕분에 창을 60ms로 넉넉히 잡아도 롤이 오인되지 않는다. */
const COMBO_MS = 60;
let recent = [], comboSize = 0;

function noteForChord(k, src){
  if(src == null) return;
  const now = performance.now();
  recent = recent.filter(h => now - h.t < COMBO_MS && h.src !== src);
  recent.push({ k, src, t:now });

  const keys = [...new Set(recent.map(h => h.k))];
  if(keys.length < 2){ comboSize = 0; return; }
  if(keys.length <= comboSize) return;     // 이미 띄운 조합이면 다시 그리지 않는다
  if(comboSize === 0) chordCount++;
  comboSize = keys.length;

  el.chords.textContent = '동시 ' + chordCount;
  el.chords.classList.add('on');
  el.combo.innerHTML = keys
    .map(c => `<i style="background:var(--${c})"></i>${LABEL[c]}`)
    .join('<span class="plus">＋</span>');
  el.combo.classList.remove('show');
  void el.combo.offsetWidth;
  el.combo.classList.add('show');
}

/* ═══════════════════════════════════════════
   입력 — 터치 우선, 키보드는 보너스
   ═══════════════════════════════════════════ */
const touching = new Map();            // pointerId → 지금 눌린 패드 key

function markHeld(){
  const on = new Set(touching.values());
  KITS.forEach(k => padEl[k].classList.toggle('held', on.has(k)));
}

el.pads.addEventListener('pointerdown', e => {
  const p = e.target.closest('.pad');
  if(!p) return;
  e.preventDefault();                  // 300ms 지연, 고스트 클릭, 길게 눌러 선택 방지
  touching.set(e.pointerId, p.dataset.k);
  markHeld();
  play(p.dataset.k, e.clientX, e.clientY, 'p' + e.pointerId, velocityAt(p, e.clientX, e.clientY));
}, { passive:false });

/* 손가락을 뗀 채로 패드를 쓸면 지나가는 패드마다 울린다 (드럼 롤).
   모바일에서 pointermove는 pointerdown 대상에 묶여 오므로,
   실제로 손가락 밑에 뭐가 있는지는 좌표로 다시 찾는다. */
el.pads.addEventListener('pointermove', e => {
  if(!touching.has(e.pointerId)) return;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const p = under && under.closest ? under.closest('.pad') : null;
  if(!p || p.dataset.k === touching.get(e.pointerId)) return;   // 같은 패드 안 꼼지락은 무시
  touching.set(e.pointerId, p.dataset.k);
  markHeld();
  // 같은 손가락이 이어서 낸 소리라 조합이 아니다 → src를 그대로 쓴다.
  // 쓸고 지나가는 건 살짝 스치는 것이므로 세기도 낮춘다.
  play(p.dataset.k, e.clientX, e.clientY, 'p' + e.pointerId, velocityAt(p, e.clientX, e.clientY) * 0.75);
}, { passive:false });

function release(e){
  if(touching.delete(e.pointerId)) markHeld();
}
// 패드 밖에서 손을 떼도 확실히 정리되게 창 전체에서 받는다
['pointerup','pointercancel'].forEach(t => addEventListener(t, release));
el.pads.addEventListener('contextmenu', e => e.preventDefault());

/* 키보드도 동시 입력이 된다.
   왼손 A S D F = 드럼 몸통, 오른손 J K L ; = 심벌 — 화면 배치와 그대로 맞다.
   킥은 다른 손 엄지로 칠 수 있게 스페이스도 받는다. Shift를 같이 누르면 강타. */
const KEYS = { a:'kick', s:'snare', d:'tom', f:'rim',
               j:'hat',  k:'open',  l:'clap', ';':'crash', ' ':'kick' };
const held = new Set();

addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key.toLowerCase();
  const k = KEYS[key];
  if(!k || !el.tune.hidden) return;
  e.preventDefault();                  // 스페이스로 페이지가 스크롤되지 않게
  // 꾹 누르고 있을 때 연속 발사 방지 — e.repeat과 자체 상태를 둘 다 본다
  if(e.repeat || held.has(key)) return;
  held.add(key);
  padEl[k].classList.add('held');
  play(k, null, null, 'k' + key, e.shiftKey ? 1 : 0.82);
});
addEventListener('keyup', e => {
  const key = e.key.toLowerCase();
  if(!held.delete(key)) return;
  const k = KEYS[key];
  // 같은 악기를 가리키는 다른 키가 아직 눌려 있으면 계속 잡고 있는 상태
  if(![...held].some(h => KEYS[h] === k)) padEl[k].classList.remove('held');
});
// 탭을 벗어나면 keyup을 못 받아 키가 눌린 채로 남는다 → 초기화
addEventListener('blur', () => {
  held.clear(); touching.clear();
  KITS.forEach(k => padEl[k].classList.remove('held'));
});

/* ═══════════════════════════════════════════
   사운드 튜닝 패널
   ═══════════════════════════════════════════ */
let tuning = 'kick';

function fmt(val, unit){
  if(unit === 'Hz') return Math.round(val) + ' Hz';
  if(unit === 's')  return Math.round(val * 1000) + ' ms';
  return val.toFixed(2);
}

function buildChips(){
  el['tune-chips'].innerHTML = '';
  KITS.forEach(k => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (k === tuning ? ' sel' : '');
    b.style.setProperty('--cc', `var(--${k})`);
    b.textContent = LABEL[k];
    b.addEventListener('click', () => { tuning = k; buildChips(); buildSliders(); preview(); });
    el['tune-chips'].appendChild(b);
  });
  el.tune.style.setProperty('--cc', `var(--${tuning})`);
}

function buildSliders(){
  const wrap = el['tune-sliders'];
  wrap.innerHTML = '';
  SPEC[tuning].forEach(([key, name, min, max, step, unit]) => {
    const row = document.createElement('div');
    row.className = 'slider';
    const lab = document.createElement('div');
    lab.className = 'lab';
    const val = document.createElement('b');
    val.textContent = fmt(P[tuning][key], unit);
    lab.append(Object.assign(document.createElement('span'), { textContent:name }), val);

    const r = document.createElement('input');
    r.type = 'range'; r.min = min; r.max = max; r.step = step;
    r.value = P[tuning][key];
    r.setAttribute('aria-label', LABEL[tuning] + ' ' + name);
    r.addEventListener('input', () => {
      P[tuning][key] = parseFloat(r.value);
      val.textContent = fmt(P[tuning][key], unit);
      saveTuning();
    });
    // 손을 뗄 때 한 번 들려준다 — 슬라이더를 끄는 내내 울리면 정신없다
    r.addEventListener('change', preview);
    row.append(lab, r);
    wrap.appendChild(row);
  });
}

function buildPresets(){
  el['tune-presets'].innerHTML = '';
  Object.keys(PRESETS).forEach(name => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn'; b.textContent = name;
    b.addEventListener('click', () => {
      const preset = PRESETS[name];
      KITS.forEach(k => {
        P[k] = Object.assign({}, DEFAULTS[k], preset ? preset[k] : null);
      });
      saveTuning(); buildSliders(); preview();
    });
    el['tune-presets'].appendChild(b);
  });
}

function preview(){
  if(!ctx) return;
  ensureRunning();
  try { VOICES[tuning](ctx.currentTime + 0.002, 0.95); } catch(e){ console.error(e); }
}

el['tune-open'].addEventListener('click', () => {
  el.tune.hidden = false;
  el['tune-open'].classList.add('on');
  buildChips(); buildSliders(); buildPresets();
});
el['tune-close'].addEventListener('click', () => {
  el.tune.hidden = true;
  el['tune-open'].classList.remove('on');
});
el['tune-play'].addEventListener('click', preview);
el['tune-reset'].addEventListener('click', () => {
  P[tuning] = Object.assign({}, DEFAULTS[tuning]);
  saveTuning(); buildSliders(); preview();
});
el['tune-reset-all'].addEventListener('click', () => {
  KITS.forEach(k => { P[k] = Object.assign({}, DEFAULTS[k]); });
  saveTuning(); buildSliders(); preview();
});

/* ═══════════════════════════════════════════
   생명주기
   ═══════════════════════════════════════════ */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && ctx) ctx.resume().then(showStatus, showStatus);
});

let gateOpened = false;
function openGate(){
  if(gateOpened) return;
  gateOpened = true;
  el.start.disabled = true;
  try{
    if(!ctx) initAudio();
  }catch(err){
    el['gate-err'].textContent = err.message || '오디오를 시작할 수 없습니다.';
    el.start.disabled = false;
    gateOpened = false;
    return;
  }
  // resume()은 프로미스라 실패할 수 있다. 실패해도 화면은 열고 상태 배지로 알린다.
  Promise.resolve(ctx.resume()).catch(() => {}).then(() => {
    showStatus();
    el.gate.classList.add('off');
    setTimeout(() => { el.gate.hidden = true; }, 300);
  });
}
el.start.addEventListener('click', openGate);
// 게이트가 떠 있을 때 아무 키나 눌러도 열리게 (데스크톱 편의)
addEventListener('keydown', e => {
  if(gateOpened || e.key === 'Tab') return;
  openGate();
});
