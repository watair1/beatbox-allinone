<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0c10">
<meta name="description" content="음원 파일 없이 Web Audio API로 소리를 합성하는 비트박스 사운드보드">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>비트박스 올인원 v0.1</title>
<style>
  :root{
    --bg:#0b0c10;
    --panel:#14161d;
    --line:#252936;
    --txt:#e8eaf2;
    --dim:#767d93;
    --kick:#ff5f52;
    --snare:#ffb03a;
    --hat:#2fd0bb;
    --open:#7b9bff;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  html{background:var(--bg);}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    display:flex;flex-direction:column;
    gap:10px;
    padding:calc(12px + var(--safe-t)) 12px calc(10px + var(--safe-b));
    overscroll-behavior:none;
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
  }

  /* ── 헤더 ─────────────────────────────── */
  header{flex:0 0 auto;display:flex;align-items:baseline;gap:7px;}
  h1{font-size:15px;margin:0;letter-spacing:-.3px;font-weight:700;}
  .ver{font-size:11px;color:var(--dim);font-weight:500;}
  .hint{margin-left:auto;font-size:11px;color:var(--dim);}

  /* ── 시작 게이트 ───────────────────────
     브라우저는 사용자 제스처 전에 오디오를 막는다.
     이 버튼이 그 "첫 제스처" 역할을 한다. */
  #gate{
    position:fixed;inset:0;z-index:50;
    background:radial-gradient(120% 90% at 50% 0%,#171a24 0%,var(--bg) 60%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:15px;padding:28px;text-align:center;
    transition:opacity .28s ease;
  }
  #gate.off{opacity:0;pointer-events:none;}
  #gate[hidden]{display:none;}   /* id 선택자가 세서 [hidden] 기본 규칙을 덮어쓴다 */
  #gate .logo{font-size:42px;line-height:1;}
  #gate h2{margin:0;font-size:21px;letter-spacing:-.4px;}
  #gate p{margin:0;color:var(--dim);font-size:13px;line-height:1.65;max-width:305px;}
  #gate .two{color:var(--txt);font-weight:600;}
  #start{
    margin-top:4px;padding:17px 46px;font:inherit;font-size:16px;font-weight:700;
    background:var(--txt);color:var(--bg);border:0;border-radius:16px;cursor:pointer;
    transition:transform .08s ease;
  }
  #start:active{transform:scale(.96);}
  #start:disabled{opacity:.5;}
  .fineprint{font-size:11px !important;line-height:1.6;opacity:.8;}
  #gate .err{color:var(--kick);font-size:12px;min-height:1em;}

  /* ── 패드 그리드 ───────────────────────
     세로: 왼쪽 열=킥·스네어(저음), 오른쪽 열=하이햇·오픈햇.
       · 자주 겹치는 조합(킥+햇, 스네어+햇)이 항상 좌우 다른 엄지에 걸린다
       · 서로 choke 관계라 동시에 울릴 수 없는 햇/오픈햇은 같은 엄지에 묶는다
     가로: 한 줄 4칸 드럼랙. */
  .pads{
    position:relative;
    flex:1 1 auto;min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    grid-template-areas:
      "kick  hat"
      "snare open";
    gap:10px;
  }
  .pad[data-k="kick"] {grid-area:kick;  --c:var(--kick); --tint:#2c1614;}
  .pad[data-k="snare"]{grid-area:snare; --c:var(--snare);--tint:#2b2011;}
  .pad[data-k="hat"]  {grid-area:hat;   --c:var(--hat);  --tint:#10241f;}
  .pad[data-k="open"] {grid-area:open;  --c:var(--open); --tint:#171c2e;}

  .pad{
    position:relative;overflow:hidden;
    font:inherit;color:inherit;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;
    touch-action:none;           /* 스크롤/줌에 터치를 뺏기지 않게 */
    transition:transform .05s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease;
  }
  /* 쉬는 중에도 색 정체성이 읽히게 아주 옅은 워시를 깔아 둔다 */
  .pad::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(95% 75% at 50% 0%,var(--c),transparent 72%);
    opacity:.07;transition:opacity .16s ease;
  }
  .pad > *{position:relative;}
  .pad .name{font-size:17px;font-weight:700;letter-spacing:-.3px;}
  .pad .key{
    font-size:10.5px;color:var(--dim);
    border:1px solid var(--line);border-radius:7px;
    padding:3px 9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    transition:color .16s ease,border-color .16s ease;
  }
  .pad .dot{
    position:absolute;top:12px;right:12px;
    width:8px;height:8px;border-radius:50%;
    background:var(--c);opacity:.45;
    transition:opacity .16s ease,box-shadow .16s ease;
  }
  .pad .n{
    position:absolute;bottom:10px;left:13px;
    font-size:10px;color:var(--dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    opacity:0;transition:opacity .2s ease;
  }
  .pad.used .n{opacity:.75;}

  .pad.hit{
    transform:scale(.962);
    background:var(--tint);
    border-color:var(--c);
    box-shadow:0 0 0 1px var(--c) inset,0 0 30px -6px var(--c);
  }
  .pad.hit::before{opacity:.24;}
  .pad.hit .dot{opacity:1;box-shadow:0 0 10px 1px var(--c);}
  .pad.hit .key{color:var(--c);border-color:var(--c);}

  /* 손가락이 올라가 있는 동안 — 어느 패드를 잡고 있는지 계속 보인다 */
  .pad.held{border-color:var(--c);}
  .pad.held::before{opacity:.16;}

  /* 오픈햇이 아직 울리는 중이라는 표시 (choke 대상) */
  .pad[data-k="open"].ringing .dot{opacity:1;animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.35;}}

  /* 터치 지점에서 퍼지는 링 — 손가락마다 따로 생긴다 */
  .ripple{
    position:absolute;border-radius:50%;pointer-events:none;
    width:12px;height:12px;margin:-6px 0 0 -6px;
    background:var(--c);opacity:.32;
    animation:ripple .42s ease-out forwards;
  }
  @keyframes ripple{to{transform:scale(26);opacity:0;}}

  /* ── 동시 타격 배지 ───────────────────
     패드 4개가 만나는 한가운데 = 조합이 성립하는 자리 */
  #combo{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%) scale(.9);
    padding:9px 16px;border-radius:999px;
    background:rgba(11,12,16,.9);border:1px solid var(--line);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    font-size:13px;font-weight:700;white-space:nowrap;
    display:flex;align-items:center;gap:7px;
    pointer-events:none;opacity:0;z-index:5;
  }
  #combo.show{animation:combo 1s ease-out forwards;}
  @keyframes combo{
    0%  {opacity:0;transform:translate(-50%,-50%) scale(.82);}
    14% {opacity:1;transform:translate(-50%,-50%) scale(1.06);}
    24% {transform:translate(-50%,-50%) scale(1);}
    72% {opacity:1;}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1);}
  }
  #combo i{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  #combo .plus{color:var(--dim);font-weight:400;margin:0 -2px;}

  /* ── 푸터 ─────────────────────────────── */
  footer{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:11px;color:var(--dim);
  }
  .stats{display:flex;gap:10px;align-items:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #count{color:var(--txt);opacity:.85;}
  #chords{color:var(--hat);opacity:0;transition:opacity .3s ease;}
  #chords.on{opacity:.9;}
  #status{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    padding:3px 8px;border:1px solid var(--line);border-radius:999px;
  }
  #status.bad{color:var(--snare);border-color:var(--snare);}

  /* 가로 모드 — 한 줄 드럼랙. 저음 왼쪽, 햇 오른쪽 순서는 유지 */
  @media (orientation:landscape) and (max-height:560px){
    body{gap:8px;padding-top:calc(8px + var(--safe-t));}
    header .hint{display:none;}
    .pads{
      grid-template-columns:repeat(4,1fr);
      grid-template-rows:1fr;
      grid-template-areas:"kick snare hat open";
    }
    #combo{top:auto;bottom:10px;transform:translate(-50%,0) scale(1);}
    #combo.show{animation:comboLand 1s ease-out forwards;}
    @keyframes comboLand{
      0%{opacity:0;transform:translate(-50%,0) scale(.82);}
      14%{opacity:1;transform:translate(-50%,0) scale(1.06);}
      24%{transform:translate(-50%,0) scale(1);}
      72%{opacity:1;}
      100%{opacity:0;transform:translate(-50%,0) scale(1);}
    }
  }

  @media (min-width:620px) and (orientation:portrait){
    body{max-width:660px;margin:0 auto;padding-top:22px;}
    .pads{gap:14px;}
    .pad .name{font-size:19px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
    #combo.show{opacity:1;}
  }
</style>
</head>
<body>

<!-- 오디오 게이트: 첫 사용자 제스처를 받아 AudioContext를 연다 -->
<div id="gate">
  <div class="logo">🥁</div>
  <h2>비트박스 올인원</h2>
  <p><b>v0.1 — 사운드보드</b><br><span class="two">두 손가락으로 동시에</span> 칠 수 있습니다.<br>음원 파일 없이 코드로 소리를 만듭니다.</p>
  <button id="start" type="button">시작하기</button>
  <p class="fineprint">브라우저는 한 번 눌러주기 전까지 소리를 막아둡니다.<br>그래서 이 버튼이 필요해요.</p>
  <p class="err" id="gate-err"></p>
</div>

<header>
  <h1>비트박스 올인원</h1>
  <span class="ver">v0.1</span>
  <span class="hint">두 손가락 동시 · 쓸어서 굴리기</span>
</header>

<main class="pads" id="pads">
  <button class="pad" type="button" data-k="kick"  tabindex="-1" aria-label="킥">
    <span class="dot"></span><span class="name">킥</span><span class="key">A · SPACE</span><span class="n">0</span>
  </button>
  <button class="pad" type="button" data-k="snare" tabindex="-1" aria-label="스네어">
    <span class="dot"></span><span class="name">스네어</span><span class="key">S</span><span class="n">0</span>
  </button>
  <button class="pad" type="button" data-k="hat"   tabindex="-1" aria-label="하이햇">
    <span class="dot"></span><span class="name">하이햇</span><span class="key">D</span><span class="n">0</span>
  </button>
  <button class="pad" type="button" data-k="open"  tabindex="-1" aria-label="오픈 하이햇">
    <span class="dot"></span><span class="name">오픈 하이햇</span><span class="key">F</span><span class="n">0</span>
  </button>
  <div id="combo"></div>
</main>

<footer>
  <span>다음 → v0.2 루프스테이션 (REC · 레이어)</span>
  <span class="stats">
    <span id="status" hidden></span>
    <span id="chords"></span>
    <span id="count">0 hits</span>
  </span>
</footer>

<script>
(() => {
'use strict';

/* ═══════════════════════════════════════════
   오디오 엔진
   ═══════════════════════════════════════════ */
let ctx = null;        // AudioContext
let master = null;     // 마스터 게인 → 리미터 → 스피커
let noiseBuf = null;   // 노이즈 원본 (스네어·하이햇 공용)

const el = {
  gate:   document.getElementById('gate'),
  start:  document.getElementById('start'),
  err:    document.getElementById('gate-err'),
  count:  document.getElementById('count'),
  chords: document.getElementById('chords'),
  combo:  document.getElementById('combo'),
  status: document.getElementById('status'),
  pads:   document.getElementById('pads')
};

function initAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) throw new Error('이 브라우저는 Web Audio를 지원하지 않습니다.');
  ctx = new AC();

  // 여러 패드를 동시에 쳐도 찌그러지지 않게 리미터를 물린다
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -6;
  limiter.knee.value      = 6;
  limiter.ratio.value     = 12;
  limiter.attack.value    = 0.002;
  limiter.release.value   = 0.12;

  master = ctx.createGain();
  master.gain.value = 0.9;
  master.connect(limiter).connect(ctx.destination);

  // 노이즈는 한 번만 만들어 두고 재생할 때마다 재사용
  const len = Math.floor(ctx.sampleRate * 0.5);
  noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}

function noiseSource(){
  const s = ctx.createBufferSource();
  s.buffer = noiseBuf;
  s.loop = true;                       // 감쇠가 버퍼보다 길어도 끊기지 않게
  return s;
}

/* ── 킥: 사인파 150Hz → 50Hz 스윕 + 게인 감쇠 ── */
function kick(t){
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(50, t + 0.11);

  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(1, t + 0.004);   // 딸깍 소리 방지용 짧은 어택
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);

  o.connect(g).connect(master);
  o.start(t);
  o.stop(t + 0.45);
}

/* ── 스네어: 7kHz 하이패스 노이즈 + 180Hz 삼각파 ── */
function snare(t){
  const n  = noiseSource();
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 7000;
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(0.75, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);
  n.connect(hp).connect(ng).connect(master);
  n.start(t);
  n.stop(t + 0.21);

  const o  = ctx.createOscillator();
  const og = ctx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(180, t);
  og.gain.setValueAtTime(0.45, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  o.connect(og).connect(master);
  o.start(t);
  o.stop(t + 0.14);
}

/* ── 하이햇: 7kHz 하이패스 노이즈. 닫힘=짧게 / 열림=길게 ──
   진짜 드럼에서 닫힌 하이햇은 울리던 오픈 하이햇을 끊는다(choke). */
let openHat = null;          // { gain, source } — choke 대상
const openPad = document.querySelector('.pad[data-k="open"]');

function chokeOpenHat(t){
  if(!openHat) return;
  const g = openHat.gain.gain;
  g.cancelScheduledValues(t);
  g.setValueAtTime(Math.max(g.value, 0.0001), t);
  g.exponentialRampToValueAtTime(0.0001, t + 0.028);   // 뚝 끊지 않고 아주 짧게 닫는다
  try { openHat.source.stop(t + 0.05); } catch(_){}
  openHat = null;
  openPad.classList.remove('ringing');
}

function hat(t, open){
  chokeOpenHat(t);                                     // 닫힘/열림 어느 쪽이든 이전 오픈햇은 정리

  const dur = open ? 0.45 : 0.06;
  const n   = noiseSource();
  const hp  = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 7000;
  const g = ctx.createGain();
  g.gain.setValueAtTime(open ? 0.45 : 0.38, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  n.connect(hp).connect(g).connect(master);
  n.start(t);
  n.stop(t + dur + 0.06);

  if(open){
    openHat = { gain:g, source:n };
    openPad.classList.add('ringing');
    n.onended = () => {                                // 스스로 다 울리고 끝난 경우
      if(openHat && openHat.source === n){
        openHat = null;
        openPad.classList.remove('ringing');
      }
    };
  }
}

const VOICES = {
  kick:  t => kick(t),
  snare: t => snare(t),
  hat:   t => hat(t, false),
  open:  t => hat(t, true)
};
const LABEL = { kick:'킥', snare:'스네어', hat:'하이햇', open:'오픈햇' };

/* ═══════════════════════════════════════════
   재생 + 화면 피드백
   ═══════════════════════════════════════════ */
let hits = 0, chordCount = 0;
const perPad = { kick:0, snare:0, hat:0, open:0 };
const padEl  = {};
document.querySelectorAll('.pad').forEach(p => { padEl[p.dataset.k] = p; });

/* 폰에서 화면을 껐다 켜거나 탭을 옮기면 컨텍스트가 suspended/interrupted가 된다.
   재생 직전에 매번 확인해서 되살린다. */
function ensureRunning(){
  if(!ctx) return;
  if(ctx.state !== 'running') ctx.resume().then(showStatus, showStatus);
}

function showStatus(){
  if(!ctx) return;
  const bad = ctx.state !== 'running';
  el.status.hidden = !bad;
  el.status.textContent = bad ? '오디오 정지 — 화면 터치' : '';
  el.status.classList.toggle('bad', bad);
}

/* 두 손가락이 "동시에" 닿아도 이벤트는 보통 5~20ms 어긋나 도착한다.
   그걸 억지로 한 시각에 맞추려면 그만큼 미리보기 지연을 깔아야 하는데,
   드럼 패드에서 지연은 어긋남보다 훨씬 나쁘다. 게다가 음색이 다른 타악기 두 개는
   20~30ms 안쪽이면 사람 귀에 한 방으로 붙어 들린다. 그래서 맞추지 않고 그냥 바로 낸다.
   (같은 JS 태스크에서 처리된 타격끼리는 currentTime이 그대로라 자연히 정렬된다.) */
function play(k, x, y, src){
  if(!ctx || !VOICES[k]) return;
  ensureRunning();

  // 이미 지난 시각에 예약하면 클릭 노이즈가 난다 → 항상 살짝 앞으로
  try { VOICES[k](ctx.currentTime + 0.002); } catch(e){ console.error(e); }

  hits++;
  perPad[k]++;
  el.count.textContent = hits + ' hits';

  const p = padEl[k];
  p.querySelector('.n').textContent = perPad[k];
  p.classList.add('used');

  // 연타할 때 애니메이션이 다시 처음부터 돌게 리플로우를 강제
  p.classList.remove('hit');
  void p.offsetWidth;
  p.classList.add('hit');
  clearTimeout(p._t);
  p._t = setTimeout(() => p.classList.remove('hit'), 95);

  if(x != null) ripple(p, x, y);
  try { navigator.vibrate && navigator.vibrate(8); } catch(_){}
  noteForChord(k, src);
}

function ripple(p, clientX, clientY){
  const r = p.getBoundingClientRect();
  const s = document.createElement('span');
  s.className = 'ripple';
  s.style.left = (clientX - r.left) + 'px';
  s.style.top  = (clientY - r.top)  + 'px';
  p.appendChild(s);
  setTimeout(() => s.remove(), 450);
}

/* ── 동시 타격 인식 ──
   "동시"의 기준을 시간만으로 잡으면 빠른 롤까지 조합으로 오인한다.
   진짜 기준은 손가락이 다른가다 — 같은 손가락(pointerId)이 패드를 쓸고 지나간 건
   아무리 빨라도 조합이 아니다. 그래서 서로 다른 입력원이 COMBO_MS 안에 들어온
   경우만 조합으로 본다. 덕분에 창을 60ms로 넉넉히 잡아도 롤이 오인되지 않는다.
   (두 손가락을 정말 동시에 내리쳐도 실제로는 그 정도 어긋난다.) */
const COMBO_MS = 60;
let recent = [];             // {k, src, t}
let comboSize = 0;           // 지금 표시 중인 조합의 크기

function noteForChord(k, src){
  if(src == null) return;
  const now = performance.now();
  recent = recent.filter(h => now - h.t < COMBO_MS && h.src !== src);
  recent.push({ k, src, t:now });

  const keys = [...new Set(recent.map(h => h.k))];
  if(keys.length < 2){ comboSize = 0; return; }

  // 2화음을 띄운 뒤 같은 묶음에서 3화음으로 커지면 다시 그린다
  if(keys.length <= comboSize) return;
  if(comboSize === 0) chordCount++;
  comboSize = keys.length;

  el.chords.textContent = '동시 ' + chordCount;
  el.chords.classList.add('on');

  el.combo.innerHTML = keys
    .map(c => `<i style="background:var(--${c})"></i>${LABEL[c]}`)
    .join('<span class="plus">＋</span>');
  el.combo.classList.remove('show');
  void el.combo.offsetWidth;
  el.combo.classList.add('show');
}

/* ═══════════════════════════════════════════
   입력 — 터치 우선, 키보드는 보너스
   ═══════════════════════════════════════════ */

/* pointerdown 하나로 터치·마우스·펜을 모두 받는다.
   손가락(pointerId)마다 따로 추적해서 몇 개를 동시에 올려도 각자 울린다. */
const touching = new Map();            // pointerId → 지금 눌린 패드 key

function markHeld(){
  const on = new Set(touching.values());
  for(const k in padEl) padEl[k].classList.toggle('held', on.has(k));
}

el.pads.addEventListener('pointerdown', e => {
  const p = e.target.closest('.pad');
  if(!p) return;
  e.preventDefault();                  // 300ms 지연, 고스트 클릭, 길게 눌러 선택 방지
  touching.set(e.pointerId, p.dataset.k);
  markHeld();
  play(p.dataset.k, e.clientX, e.clientY, 'p' + e.pointerId);
}, { passive:false });

/* 손가락을 뗀 채로 패드를 쓸면 지나가는 패드마다 울린다 (드럼 롤).
   모바일에서 pointermove는 pointerdown 대상에 묶여 오므로,
   실제로 손가락 밑에 뭐가 있는지는 좌표로 다시 찾는다. */
el.pads.addEventListener('pointermove', e => {
  if(!touching.has(e.pointerId)) return;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const p = under && under.closest ? under.closest('.pad') : null;
  if(!p || p.dataset.k === touching.get(e.pointerId)) return;   // 같은 패드 안에서 꼼지락대는 건 무시
  touching.set(e.pointerId, p.dataset.k);
  markHeld();
  // 같은 손가락이 이어서 낸 소리라 조합이 아니다 → 같은 src를 그대로 쓴다
  play(p.dataset.k, e.clientX, e.clientY, 'p' + e.pointerId);
}, { passive:false });

function release(e){
  if(!touching.delete(e.pointerId)) return;
  markHeld();
}
// 패드 밖에서 손을 떼도 확실히 정리되게 창 전체에서 받는다
['pointerup','pointercancel'].forEach(t => addEventListener(t, release));
el.pads.addEventListener('contextmenu', e => e.preventDefault());

/* 키보드도 동시 입력이 된다. 킥은 다른 손 엄지로 칠 수 있게 스페이스도 받는다. */
const KEYS = { a:'kick', s:'snare', d:'hat', f:'open', ' ':'kick' };
const held = new Set();

addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key.toLowerCase();
  const k = KEYS[key];
  if(!k) return;
  e.preventDefault();                  // 스페이스로 페이지가 스크롤되지 않게
  // 꾹 누르고 있을 때 연속 발사 방지 — e.repeat과 자체 상태를 둘 다 본다
  if(e.repeat || held.has(key)) return;
  held.add(key);
  padEl[k].classList.add('held');
  play(k, null, null, 'k' + key);
});
addEventListener('keyup', e => {
  const key = e.key.toLowerCase();
  if(!held.delete(key)) return;
  const k = KEYS[key];
  // 같은 악기를 가리키는 다른 키가 아직 눌려 있으면 계속 잡고 있는 상태
  if(![...held].some(h => KEYS[h] === k)) padEl[k].classList.remove('held');
});
// 탭을 벗어나면 keyup을 못 받아 키가 눌린 채로 남는다 → 초기화
addEventListener('blur', () => {
  held.clear();
  touching.clear();
  for(const k in padEl) padEl[k].classList.remove('held');
});

/* ═══════════════════════════════════════════
   생명주기
   ═══════════════════════════════════════════ */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && ctx){
    ctx.resume().then(showStatus, showStatus);
  }
});

let gateOpened = false;
function openGate(){
  if(gateOpened) return;
  gateOpened = true;
  el.start.disabled = true;
  try{
    if(!ctx) initAudio();
  }catch(err){
    el.err.textContent = err.message || '오디오를 시작할 수 없습니다.';
    el.start.disabled = false;
    gateOpened = false;
    return;
  }
  // resume()은 프로미스라 실패할 수 있다. 실패해도 화면은 열고 상태 배지로 알린다.
  Promise.resolve(ctx.resume()).catch(() => {}).then(() => {
    showStatus();
    el.gate.classList.add('off');
    setTimeout(() => { el.gate.hidden = true; }, 300);
  });
}

el.start.addEventListener('click', openGate);
// 게이트가 떠 있을 때 아무 키나 눌러도 열리게 (데스크톱 편의)
addEventListener('keydown', e => {
  if(gateOpened || e.key === 'Tab') return;
  openGate();
});

})();
</script>
